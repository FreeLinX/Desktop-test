Section "Files"
    ModulePath      "/usr/share/X11/xtree/lib/xorg/modules"
    ModulePath      "/usr/lib/xorg/modules"
    FontPath        "/usr/share/fonts/TTF"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Module"
    Disable "dri2"
    Disable "glx"
EndSection

Section "InputDevice"
    Identifier  "Keyboard"
    Driver      "flkey"
    Option      "Device"   "/dev/fl-kbd"
EndSection

Section "InputDevice"
    Identifier  "Mouse"
    Driver      "flpointer"
    Option      "Device"   "/dev/fl-pointer"
EndSection

Section "Device"
    Identifier  "QEMUFB"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "QEMUFB"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1024x768"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "simple"
    Screen      "Screen0"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse"    "CorePointer"
EndSection