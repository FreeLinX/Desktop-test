# FreeLinX/ports - graphics/cairo-1.18.4 : meson cross file (FreeLinX musl toolchain).
[binaries]
c       = '/home/kanan/FreeLinX-workspace/toolchain/bin/freelinix-cc'
ar      = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-ar'
ranlib  = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-ranlib'
strip   = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
c_args = ['-O2', '-Wno-macro-redefined', '-DHAVE_XRENDERCREATESOLIDFILL=1', '-DHAVE_XRENDERCREATELINEARGRADIENT=1', '-DHAVE_XRENDERCREATERADIALGRADIENT=1', '-DHAVE_XRENDERCREATECONICALGRADIENT=1']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
