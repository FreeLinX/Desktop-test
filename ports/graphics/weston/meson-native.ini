# FreeLinX/ports - graphics/weston : meson native (host) file.
# wayland-scanner must run on the build host; built natively into host-wl.
[binaries]
wayland-scanner = '/tmp/opencode/host-wl/bin/wayland-scanner'
pkg-config = '/usr/bin/pkg-config'

[properties]
pkg_config_libdir = '/tmp/opencode/host-wl/lib/pkgconfig'

[built-in options]
c_args = []
c_link_args = []