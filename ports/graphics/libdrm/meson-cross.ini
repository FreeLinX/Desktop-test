# FreeLinX/ports - graphics/libdrm : meson cross file for the FreeLinX
# clang + LLD + musl toolchain.

[binaries]
c       = '/home/kanan/FreeLinX-workspace/toolchain/bin/freelinix-cc'
cpp     = '/home/kanan/FreeLinX-workspace/toolchain/bin/freelinix-c++'
ar      = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-ar'
ranlib  = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-ranlib'
strip   = '/home/kanan/FreeLinX-workspace/toolchain/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O2', '-include', 'sys/sysmacros.h']
c_link_args = []
cpp_args = ['-O2', '-stdlib=libc++']
cpp_link_args = []

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'